<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1050 Snack Finder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      color: #666;
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .search-box {
      display: flex;
      gap: 10px;
      max-width: 560px;
      margin: 0 auto 40px;
    }

    .search-box input {
      flex: 1;
      padding: 14px 18px;
      font-size: 1rem;
      border: 2px solid #1a1a1a;
      border-radius: 8px;
      outline: none;
      background: #fff;
      transition: border-color 0.15s;
    }

    .search-box input:focus {
      border-color: #4f46e5;
    }

    .search-box button {
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .search-box button:hover { background: #333; }
    .search-box button:disabled { background: #999; cursor: not-allowed; }

    .status {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 24px;
      min-height: 24px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #ccc;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    @media (max-width: 680px) {
      .results { grid-template-columns: 1fr; }
    }

    .store-col h2 {
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding-bottom: 12px;
      border-bottom: 2px solid #1a1a1a;
      margin-bottom: 16px;
    }

    .product-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .product-name {
      font-weight: 600;
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .product-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
      color: #555;
    }

    .product-meta .highlight {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1a1a1a;
    }

    .badge {
      display: inline-block;
      background: #eef2ff;
      color: #4f46e5;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      margin-top: 6px;
    }

    .empty {
      color: #999;
      font-size: 0.9rem;
      padding: 20px 0;
    }

    .error-msg {
      text-align: center;
      color: #dc2626;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <h1>1050 Snack Finder</h1>
  <p>Cheapest snacks on Instacart · Costco &amp; Safeway · 1050 Sansome St, SF</p>
</header>

<div class="search-box">
  <input id="query" type="text" placeholder="e.g. granola bars, chips, nuts, jerky" />
  <button id="searchBtn" onclick="search()">Search</button>
</div>

<div class="status" id="status"></div>
<div class="results" id="results"></div>

<script>
  document.getElementById('query').addEventListener('keydown', e => {
    if (e.key === 'Enter') search();
  });

  function search() {
    const query = document.getElementById('query').value.trim();
    if (!query) return;

    const btn = document.getElementById('searchBtn');
    const status = document.getElementById('status');
    const results = document.getElementById('results');

    btn.disabled = true;
    results.innerHTML = '';
    status.innerHTML = '<span class="spinner"></span> Searching Costco and Safeway on Instacart…';

    const es = new EventSource(`/search?q=${encodeURIComponent(query)}`);

    es.onmessage = (e) => {
      const data = JSON.parse(e.data);

      if (data.type === 'store') {
        status.innerHTML = `<span class="spinner"></span> Got ${data.store} results — loading next store…`;
        results.appendChild(renderStore(data.store, data.products));
      }

      if (data.type === 'done') {
        status.textContent = `Done · results for "${query}" · prices may vary from in-store`;
        btn.disabled = false;
        es.close();
      }

      if (data.type === 'error') {
        status.innerHTML = `<span class="error-msg">Error: ${data.message}</span>`;
        btn.disabled = false;
        es.close();
      }
    };

    es.onerror = () => {
      status.innerHTML = '<span class="error-msg">Connection error — try again</span>';
      btn.disabled = false;
      es.close();
    };
  }

  function renderStore(name, products) {
    const col = document.createElement('div');
    col.className = 'store-col';

    const heading = document.createElement('h2');
    heading.textContent = name;
    col.appendChild(heading);

    if (!products.length) {
      const empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = 'No results found (store may not be available in this area or nothing matched).';
      col.appendChild(empty);
      return col;
    }

    for (const p of products) {
      const card = document.createElement('div');
      card.className = 'product-card';

      const ppm = p.pricePerMeal != null
        ? `$${p.pricePerMeal.toFixed(2)} / snack-meal`
        : 'price per meal unknown';

      card.innerHTML = `
        <div class="product-name">${esc(p.name)}</div>
        <div class="product-meta">
          ${p.size ? `<span>Size: ${esc(p.size)}</span>` : ''}
          <span class="highlight">$${p.price.toFixed(2)}</span>
          ${p.servings ? `<span>${p.servings} snack-meals · ${esc(p.servingsBasis)}</span>` : ''}
          <span class="badge">${ppm}</span>
        </div>
      `;
      col.appendChild(card);
    }

    return col;
  }

  function esc(str) {
    return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
