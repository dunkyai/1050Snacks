name: deploy

# Auto-deploys on push to main, or trigger manually from anywhere.
# Secrets required (repo Settings → Secrets → Actions):
#   DEPLOY_SSH_KEY  — copy the same value from dunkyai/dunky-hosting repo secrets

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy 1050snacks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "135.181.222.36 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHr59jVWvy6FCR7dWVT3OPnNS7EGj77t38eCDnDgkueL" >> ~/.ssh/known_hosts

      - name: Build and deploy on server
        run: |
          ssh -i ~/.ssh/id_ed25519 root@135.181.222.36 'bash -s' << 'ENDSSH'
            set -euo pipefail

            # Clone or update repo
            if [ -d /opt/1050snacks ]; then
              echo "Pulling latest..."
              git -C /opt/1050snacks pull origin main
            else
              echo "Cloning repo..."
              git clone https://github.com/dunkyai/1050Snacks /opt/1050snacks
            fi

            cd /opt/1050snacks

            # Build image
            echo "Building Docker image..."
            docker build -t 1050snacks .

            # Replace container
            docker stop 1050snacks 2>/dev/null || true
            docker rm   1050snacks 2>/dev/null || true
            docker run -d \
              --name 1050snacks \
              --restart unless-stopped \
              -p 3456:3000 \
              1050snacks

            STATUS=$(docker ps --filter name=1050snacks --format '{{.Status}}')
            echo "Done — container status: $STATUS"

            # Ensure snacks.dunky.ai block is in Caddy with correct SSE config.
            # Always remove and re-add to pick up config changes (e.g. flush_interval).
            CADDYFILE="/opt/agentpost/Caddyfile"
            # Remove existing snacks block (handles both old and new format)
            python3 - "$CADDYFILE" <<'PYEOF'
import re, sys
path = sys.argv[1]
text = open(path).read()
# Remove the comment + block for snacks.dunky.ai
text = re.sub(
    r'# 1050 Snack Finder[^\n]*\nsnacks\.dunky\.ai \{[^}]*\}\n*',
    '', text, flags=re.DOTALL
)
open(path, 'w').write(text)
PYEOF
            # Insert the block with SSE support before the wildcard catch-all
            SNACKS_BLOCK='# 1050 Snack Finder\nsnacks.dunky.ai {\n    tls {\n        dns cloudflare {env.CLOUDFLARE_API_TOKEN}\n    }\n    reverse_proxy localhost:3456 {\n        flush_interval -1\n        transport http {\n            response_header_timeout 90s\n        }\n    }\n}\n'
            sed -i "s|# Wildcard TLS|${SNACKS_BLOCK}\n# Wildcard TLS|" "$CADDYFILE"
            /opt/openclaw-source/caddy/rebuild-config.sh --reload
            echo "Caddy config updated and reloaded"
          ENDSSH
