name: deploy

# Auto-deploys on push to main, or trigger manually from anywhere.
# Secrets required (repo Settings → Secrets → Actions):
#   DEPLOY_SSH_KEY  — copy the same value from dunkyai/dunky-hosting repo secrets

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy 1050snacks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "135.181.222.36 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHr59jVWvy6FCR7dWVT3OPnNS7EGj77t38eCDnDgkueL" >> ~/.ssh/known_hosts

      - name: Stage cookies for deploy
        env:
          INSTACART_COOKIES: ${{ secrets.INSTACART_COOKIES }}
        run: |
          printf '%s' "$INSTACART_COOKIES" | base64 -w0 > /tmp/ic.b64
          scp -i ~/.ssh/id_ed25519 /tmp/ic.b64 root@135.181.222.36:/tmp/ic.b64

      - name: Build and deploy on server
        run: |
          ssh -i ~/.ssh/id_ed25519 root@135.181.222.36 'bash -s' << 'ENDSSH'
            set -euo pipefail

            # Clone or update repo
            if [ -d /opt/1050snacks ]; then
              echo "Pulling latest..."
              git -C /opt/1050snacks pull origin main
            else
              echo "Cloning repo..."
              git clone https://github.com/dunkyai/1050Snacks /opt/1050snacks
            fi

            cd /opt/1050snacks

            # Build image
            echo "Building Docker image..."
            docker build -t 1050snacks .

            # Read cookies (base64-encoded to survive shell quoting)
            IC_COOKIES=$(cat /tmp/ic.b64 | tr -d '\n')
            rm -f /tmp/ic.b64

            # Ensure data directory exists for SQLite cart persistence
            mkdir -p /opt/1050snacks-data

            # Replace container
            docker stop 1050snacks 2>/dev/null || true
            docker rm   1050snacks 2>/dev/null || true
            docker run -d \
              --name 1050snacks \
              --restart unless-stopped \
              -p 3456:3000 \
              -v /opt/1050snacks-data:/data \
              -e "INSTACART_COOKIES_B64=$IC_COOKIES" \
              -e "SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}" \
              -e "SLACK_SIGNING_SECRET=${{ secrets.SLACK_SIGNING_SECRET }}" \
              -e "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" \
              -e "GOOGLE_SERVICE_ACCOUNT_JSON=${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" \
              -e "GOOGLE_DRIVE_RECEIPTS_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_RECEIPTS_FOLDER_ID }}" \
              -e "GOOGLE_SHEETS_SPEND_ID=${{ secrets.GOOGLE_SHEETS_SPEND_ID }}" \
              1050snacks

            STATUS=$(docker ps --filter name=1050snacks --format '{{.Status}}')
            echo "Done — container status: $STATUS"

            # Ensure snacks.dunky.ai is in Caddy with SSE flush_interval support
            CADDYFILE="/opt/agentpost/Caddyfile"
            if ! grep -q "flush_interval" "$CADDYFILE"; then
              if grep -q "^snacks\.dunky\.ai" "$CADDYFILE"; then
                sed -i '/^snacks\.dunky\.ai/,/^}/{s|    reverse_proxy localhost:3456$|    reverse_proxy localhost:3456 {\n        flush_interval -1\n        transport http {\n            response_header_timeout 90s\n        }\n    }|}' "$CADDYFILE"
              else
                sed -i "s|# Wildcard TLS|# 1050 Snack Finder\nsnacks.dunky.ai {\n    tls {\n        dns cloudflare {env.CLOUDFLARE_API_TOKEN}\n    }\n    reverse_proxy localhost:3456 {\n        flush_interval -1\n        transport http {\n            response_header_timeout 90s\n        }\n    }\n}\n\n# Wildcard TLS|" "$CADDYFILE"
              fi
              /opt/openclaw-source/caddy/rebuild-config.sh --reload
              echo "Caddy updated with SSE config"
            else
              echo "Caddy already has flush_interval, skipping"
            fi
          ENDSSH
